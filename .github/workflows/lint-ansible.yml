---
name: Ansible linting
run-name: ${{ github.actor }} is linting Ansible 🚀
on: push
jobs:
  Linting:
    # Use ansible-lint workflow by Ansible to perform linting
    # Runs ansible-lint against all 'yml' and "yaml" files
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
    with:
      args: '-p .'